name: pare-landing-playwright

on:
  pull_request:
    paths:
      - 'apps/web/public/pare-preview/**'
      - 'apps/web/public/_redirects'
      - 'apps/web/app/[[...slug]]/client-app.tsx'
      - 'e2e/ui/pare-landing.test.ts'
      - 'e2e/package.json'
      - '.github/workflows/pare-landing-playwright.yml'
  workflow_dispatch:
    inputs:
      landing_url:
        description: Full PARÉ landing URL to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pare-landing-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: PARÉ landing Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PARE_LANDING_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--pauli-para.netlify.app/pare-preview/', github.event.pull_request.number) || inputs.landing_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Install Chromium
        run: pnpm --filter @open-design/e2e exec playwright install --with-deps chromium

      - name: Wait for exact PR preview
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $PARE_LANDING_URL"
          for attempt in $(seq 1 40); do
            status="$(curl -L -sS -o /dev/null -w '%{http_code}' "$PARE_LANDING_URL" || true)"
            if [ "$status" = "200" ]; then
              echo "Preview is ready."
              exit 0
            fi
            echo "Attempt $attempt/40 -> HTTP $status"
            sleep 10
          done
          echo "::error::Netlify preview did not become ready in time"
          exit 1

      - name: Require a landing URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PARE_LANDING_URL:-}" || {
            echo "::error::PARE_LANDING_URL is required"
            exit 1
          }

      - name: Run PARÉ browser contract
        env:
          OD_PLAYWRIGHT_WORKERS: "1"
        run: pnpm --filter @open-design/e2e test:ui:pare-landing

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pare-landing-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/ui/reports/playwright-html-report
            e2e/ui/reports/test-results
            e2e/ui/reports/results.json
            e2e/ui/reports/junit.xml
          if-no-files-found: ignore
          retention-days: 7
