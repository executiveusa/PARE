<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>PARÉ Studio — Diffusion Lab</title>
<style>
:root{--paper:#f3f1eb;--ink:#11110f;--muted:#77736b;--line:rgba(17,17,15,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100svh;display:grid;grid-template-rows:auto 1fr}.top{height:58px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.mark{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}.topRight{display:flex;align-items:center;gap:14px}.lab{font:500 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:7px 0;cursor:pointer;color:var(--ink);font:500 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase}.track{width:32px;height:18px;border:1px solid currentColor;border-radius:999px;position:relative}.knob{position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:currentColor;transition:transform 180ms ease}.switch[aria-pressed="true"] .knob{transform:translateX(14px)}.switch[aria-pressed="false"]{color:var(--muted)}.studio{width:min(860px,100%);margin:0 auto;padding:11vh 18px 9vh;display:grid;grid-template-rows:1fr auto;gap:36px}.thread{display:flex;flex-direction:column;gap:30px;justify-content:flex-end}.row{display:grid;grid-template-columns:74px 1fr;gap:18px;align-items:start}.role{padding-top:5px;font:500 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.msg{font-size:clamp(22px,3.1vw,40px);font-weight:300;line-height:1.08;letter-spacing:-.035em}.assistant .msg{max-width:690px}.user .msg{max-width:610px;color:#5d5952}.char{display:inline-block;white-space:pre;will-change:opacity,filter,transform;transform-origin:center}.char.locked{filter:none!important;opacity:1!important;transform:none!important}.status{display:flex;align-items:center;gap:9px;margin-top:14px;font:500 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}.replay{margin-left:8px;border:0;background:none;color:inherit;cursor:pointer;padding:4px 0;border-bottom:1px solid currentColor;font:inherit;letter-spacing:inherit;text-transform:inherit}.composer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-top:1px solid var(--ink);padding-top:16px}.composer textarea{resize:none;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:400 18px/1.35 inherit;min-height:56px;max-height:140px;padding:8px 2px}.send{border:0;background:transparent;border-bottom:1px solid var(--ink);padding:10px 0 7px;cursor:pointer;font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}.controls{position:fixed;right:16px;top:82px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}.chip{border:1px solid var(--line);background:rgba(243,241,235,.86);backdrop-filter:blur(12px);padding:8px 10px;font:500 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}@media(max-width:640px){.top{padding:0 14px}.lab{display:none}.studio{padding:9vh 14px 7vh;gap:28px}.row{grid-template-columns:52px 1fr;gap:10px}.msg{font-size:25px}.controls{position:static;padding:0 14px 14px;justify-content:flex-start}.chip{padding:7px 8px}}@media(prefers-reduced-motion:reduce){.char{filter:none!important;opacity:1!important;transform:none!important}.knob{transition:none}}
</style>
</head>
<body>
<div class="shell"><header class="top"><span class="mark">PARÉ</span><div class="topRight"><span class="lab">Studio / Diffusion Lab</span><button class="switch" id="diffusionSwitch" type="button" aria-pressed="true"><span>Diffusion</span><span class="track" aria-hidden="true"><span class="knob"></span></span></button></div></header><main class="studio"><section class="thread" id="thread"><div class="row user"><div class="role">You</div><div class="msg">Build a brand direction that feels intelligent, restrained and unmistakably ours.</div></div><div class="row assistant"><div class="role">PARÉ</div><div><div class="msg" id="output" aria-live="polite"></div><div class="status"><span class="dot"></span><span id="status">resolving signal</span><button class="replay" id="replay" type="button">Replay</button></div></div></div></section><form class="composer" id="composer"><textarea id="prompt" rows="2" placeholder="Ask PARÉ to make something…">Give me the clearest possible direction.</textarea><button class="send" type="submit">Run ↗</button></form></main></div>
<div class="controls"><span class="chip">model agnostic</span><span class="chip">parallel denoise</span><span class="chip">presentation layer</span><span class="chip">DOM text</span></div>
<script>
(()=>{
const GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+-/:;.%#*?|(){}[],';
const answer='Reduce the noise. Keep the intelligence. One strong direction, resolved from many possibilities.';
const output=document.getElementById('output');
const status=document.getElementById('status');
const prompt=document.getElementById('prompt');
const composer=document.getElementById('composer');
const toggle=document.getElementById('diffusionSwitch');
const replay=document.getElementById('replay');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let raf=0,currentText=answer;
let enabled=localStorage.getItem('pare-diffusion-enabled')!=='false';
const rand=()=>GLYPHS[(Math.random()*GLYPHS.length)|0];
const clamp=n=>Math.max(0,Math.min(1,n));
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
function syncToggle(){toggle.setAttribute('aria-pressed',String(enabled));}
function renderPlain(text){cancelAnimationFrame(raf);output.textContent=text;output.setAttribute('aria-label',text);status.textContent='diffusion off';}
function run(text){
 currentText=text; cancelAnimationFrame(raf); output.textContent='';
 if(!enabled||reduced){renderPlain(text);status.textContent=reduced?'reduced motion':'diffusion off';return}
 status.textContent='diffusing';
 const chars=Array.from(text);
 const start=performance.now();
 const slots=chars.map((final,i)=>{
  const span=document.createElement('span');span.className='char';span.setAttribute('aria-hidden','true');
  const space=/\s/.test(final);span.textContent=space?final:rand();output.appendChild(span);
  const seed=((i*47)%113)/112;
  const cluster=((i*19)%11)/10;
  const lockAt=start+520+seed*1050+cluster*260+(Math.random()*260-130);
  return{span,final,space,lockAt,last:0,seed,cluster};
 });
 output.setAttribute('aria-label',text);
 function tick(t){
  let active=0;
  for(const s of slots){
   if(s.space||s.span.classList.contains('locked'))continue;
   const ttl=s.lockAt-t;
   if(ttl<=0){s.span.textContent=s.final;s.span.classList.add('locked');continue}
   active++;
   const total=Math.max(700,s.lockAt-start);
   const p=smooth(1-clamp(ttl/total));
   const phase=p<.38?'noise':p<.76?'search':'near';
   const interval=phase==='noise'?30:phase==='search'?46:68;
   const pFinal=phase==='noise'?.015:phase==='search'?.22:.78;
   if(t-s.last>interval){s.last=t;s.span.textContent=Math.random()<pFinal?s.final:rand()}
   const depth=.65+s.seed*.9;
   const blur=(1-p)*(5.4*depth);
   const opacity=.28+p*.72;
   const jitter=(1-p)*(2.2*depth);
   const jx=(Math.random()-.5)*jitter, jy=(Math.random()-.5)*jitter;
   const scale=.92+p*.08+(1-p)*(s.cluster-.5)*.08;
   s.span.style.filter=`blur(${blur.toFixed(2)}px) brightness(${(.68+p*.32).toFixed(2)})`;
   s.span.style.opacity=opacity.toFixed(3);
   s.span.style.transform=`translate(${jx.toFixed(2)}px,${jy.toFixed(2)}px) scale(${scale.toFixed(3)})`;
  }
  status.textContent=active?'diffusing':'resolved';
  if(active)raf=requestAnimationFrame(tick);
 }
 raf=requestAnimationFrame(tick);
}
toggle.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('pare-diffusion-enabled',String(enabled));syncToggle();run(currentText)});
replay.addEventListener('click',()=>run(currentText));
composer.addEventListener('submit',e=>{e.preventDefault();const q=prompt.value.trim();if(!q)return;const response=q.toLowerCase().includes('brand')?'Signal first. Strip away the generic moves. Keep only the choices that make the brand recognizable.':'PARÉ is reducing competing possibilities now. The final answer should feel discovered, not typed.';run(response)});
syncToggle();run(answer);
})();
</script>
</body></html>
