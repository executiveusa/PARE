name: pare-runtime

services:
  pare-daemon:
    container_name: pare-daemon
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_DATA_DIR: /app/.od
      OD_API_TOKEN: ${PARE_API_TOKEN:-${OD_API_TOKEN:-}}
      PARE_API_TOKEN: ${PARE_API_TOKEN:-${OD_API_TOKEN:-}}
      PARE_BOOTSTRAP_SECRET: ${PARE_BOOTSTRAP_SECRET:-${INFISCAL_API_TOKEN:-}}
      INFISCAL_API_TOKEN: ${INFISCAL_API_TOKEN:-${PARE_BOOTSTRAP_SECRET:-}}
      OD_ALLOWED_ORIGINS: "https://pauli-para.netlify.app,https://pare-api.thepaulieffect.com,https://api.thepaulieffect.com,http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:7456:7456"
    volumes:
      - /data/pare:/app/.od
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    pids_limit: 512
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
